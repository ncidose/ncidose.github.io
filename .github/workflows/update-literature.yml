name: Update literature data

on:
  schedule:
    # GitHub cron uses UTC. Checking both offsets keeps 09:00 America/New_York
    # correct across daylight-saving and standard time.
    - cron: "0 13,14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      run_update: ${{ steps.schedule.outputs.run_update }}
    steps:
      - name: Check Eastern Time schedule
        id: schedule
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$(TZ=America/New_York date +%H)" == "09" ]]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.schedule.outputs.run_update == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        if: steps.schedule.outputs.run_update == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.schedule.outputs.run_update == 'true'
        run: npm ci

      - name: Refresh literature data
        if: steps.schedule.outputs.run_update == 'true'
        run: npm run literature:update

      - name: Commit update
        if: steps.schedule.outputs.run_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/literature.json
          git commit -m "Update literature data"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Setup Pages
        if: steps.schedule.outputs.run_update == 'true'
        uses: actions/configure-pages@v5

      - name: Build site
        if: steps.schedule.outputs.run_update == 'true'
        run: npm run build:pages
        env:
          VITE_GA_MEASUREMENT_ID: G-95GQF2F891

      - name: Upload Pages artifact
        if: steps.schedule.outputs.run_update == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: needs.update.outputs.run_update == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
